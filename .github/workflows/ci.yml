name: CI

# Branch strategy per CLAUDE.md "Supporting tooling": main = production (protected,
# only merges from dev), dev = integration branch. Every PR into either runs this.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Spotless (format check)
        run: ./gradlew spotlessCheck --console=plain

      - name: Compile
        run: ./gradlew compileJava testClasses --console=plain

      - name: Test
        # JUnit 5 + Testcontainers — ubuntu-latest runners have Docker preinstalled,
        # needed for the real Postgres/RabbitMQ/Redis containers per CLAUDE.md.
        run: ./gradlew test --console=plain

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check + build
        run: npm run build

      - name: Test
        run: npm test
