name: ci

on:
  push:
    branches: [main]
  pull_request:
  # "Run workflow" on main re-runs the checks and redeploys without a new commit.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR cancels its older run; runs on main are never cancelled mid-deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # Testcontainers starts Postgres, RabbitMQ and Redis; the S3 client needs SeaweedFS at startup.
      - run: |
          docker compose -f infra/docker-compose.yml up -d seaweedfs
          for _ in $(seq 1 30); do curl -s -o /dev/null http://localhost:8333 && exit 0; sleep 2; done
          exit 1
      - working-directory: backend
        run: ./gradlew spotlessCheck test --no-daemon
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test

  telegram-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - working-directory: telegram-bot
        run: ./gradlew spotlessCheck test --no-daemon

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test
      # Playwright builds the production bundle and starts it, so this step is also the build check.
      # The route-guard specs hit proxy.ts directly; no backend needed.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

  # Runs on the server itself (self-hosted runner labelled "academix-production"): the server has
  # no open ports, so it pulls the work instead of GitHub pushing it. Switch it on with the repo
  # variable DEPLOY_ENABLED=true; while the runner is stopped, main pushes don't queue a deploy.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: [backend, telegram-bot, frontend]
    runs-on: [self-hosted, academix-production]
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      # The script comes from the verified commit, not from whatever is checked out on the server.
      # It validates infra/.env, builds one image at a time (3.3 GB of RAM), waits for health,
      # prunes old images, and rolls back to the previous revision if anything fails.
      - name: Deploy
        run: |
          cd /home/ubuntu/academixai/academix
          git fetch --quiet origin main
          git show "${GITHUB_SHA}:scripts/deploy-vps.sh" > /tmp/academix-deploy.sh
          bash /tmp/academix-deploy.sh "${GITHUB_SHA}"
          rm -f /tmp/academix-deploy.sh
