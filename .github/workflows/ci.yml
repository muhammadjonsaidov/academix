name: CI

# Runs on every push and PR to the two long-lived branches (CLAUDE.md branch strategy:
# main = production, dev = integration; feature branches run CI via the pull_request trigger).
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# A newer push to the same branch cancels the older run — no point finishing CI for a commit
# that has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (compile, format, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # spotlessCheck, not spotlessApply: CI must fail on unformatted code rather than silently
      # rewrite it. The build-gate hook applies formatting locally during development.
      - name: Compile and check formatting
        working-directory: backend
        run: ./gradlew compileJava compileTestJava spotlessCheck --console=plain

      # TestcontainersConfiguration provides Postgres (pgvector variant — plain postgres has no
      # `vector` extension), RabbitMQ and Redis, but NOT SeaweedFS. FileStorageService calls
      # ensureBucketExists() from @PostConstruct, so without a live S3 endpoint the whole
      # ApplicationContext fails to start and every context-backed test fails with a misleading
      # "ApplicationContext failure threshold exceeded" (18 of 50 tests, all downstream of one
      # root cause). Reuses infra/docker-compose.yml rather than redeclaring the service: plain
      # `seaweedfs -s3` without -s3.config rejects every signed request, so the mounted
      # s3-config.json there is load-bearing, not decorative.
      - name: Start SeaweedFS (required by the Spring context)
        run: docker compose -f infra/docker-compose.yml up -d seaweedfs

      - name: Wait for SeaweedFS
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:8333; then echo "seaweedfs up"; exit 0; fi
            sleep 2
          done
          echo "seaweedfs did not come up in 60s"; exit 1

      # Testcontainers needs a Docker daemon; ubuntu-latest runners have one preinstalled.
      - name: Test
        working-directory: backend
        run: ./gradlew test --console=plain

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Separate from `next build`: Next runs its own type-check, but a bare tsc catches test
      # files and anything outside the build graph.
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Test
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        # proxy.ts throws without a JWT_SECRET at request time (not build time), but the build
        # shouldn't depend on a real secret either way — this is a throwaway CI value.
        env:
          JWT_SECRET: ci-build-only-placeholder-not-a-real-secret
        run: npm run build

  e2e:
    name: E2E (route guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # No backend is needed: the guard specs assert on raw proxy.ts redirect responses, and
      # playwright.config.ts builds + starts the frontend itself (standalone entrypoint) with its
      # own throwaway JWT_SECRET.
      - name: Run E2E
        working-directory: frontend
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

  telegram-bot:
    name: Telegram bot (compile, format, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Its own independent Gradle build — the backend job above does not cover this service.
      - name: Compile and check formatting
        working-directory: telegram-bot
        run: ./gradlew compileJava compileTestJava spotlessCheck --console=plain

      - name: Test
        working-directory: telegram-bot
        run: ./gradlew test --console=plain
