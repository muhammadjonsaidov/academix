name: Continuous Deployment

# Deploy only after the CI run for a push to main has succeeded. This prevents a
# second workflow triggered by the same push from deploying code that failed CI.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Production has one Compose stack. Serialising deployments prevents two runs
# from checking out/rebuilding the same working tree at the same time.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy verified main commit to VPS
    # workflow_run can also be caused by a PR. Only a successful push to main
    # is allowed to reach the server.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    # Deployment runs on the VPS itself.  The server is on a private network,
    # so this avoids depending on an inbound SSH connection from GitHub-hosted
    # runners while keeping the build and Compose restart local to the server.
    runs-on: [self-hosted, Linux, X64, academix-production]
    environment:
      name: production

    steps:
      - name: Deploy and verify
        shell: bash
        run: |
          cd /home/ubuntu/academixai/academix
          git fetch --quiet origin main
          git cat-file -e '${{ github.event.workflow_run.head_sha }}^{commit}'
          git show '${{ github.event.workflow_run.head_sha }}:scripts/deploy-vps.sh' > /tmp/academix-deploy-vps.sh
          bash /tmp/academix-deploy-vps.sh '${{ github.event.workflow_run.head_sha }}'
          rm -f /tmp/academix-deploy-vps.sh
