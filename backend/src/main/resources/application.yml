spring:
  # No profile was ever actually activated anywhere in this project (no spring.profiles.active,
  # no bootRun override) despite CLAUDE.md's "Supporting tooling" section deciding seed data
  # should be `local`/`dev`-profile-gated — this default is what actually wires that decision up.
  # A real deploy sets SPRING_PROFILES_ACTIVE to something else (e.g. `prod`) to skip seeding.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: backend

  # App's own runtime queries use a restricted, non-superuser role — RLS is silently
  # inert for a superuser/BYPASSRLS role (the POSTGRES_USER default), confirmed by a
  # real test. Migrations (below) still need the superuser for CREATE EXTENSION etc.
  # See CLAUDE.md "Reality checks" and infra/postgres-init/01-app-role.sh.
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/academix}
    username: ${DATABASE_APP_USERNAME:academix_app}
    password: ${DATABASE_APP_PASSWORD:academix_app_local_dev_only}
    hikari:
      # Default is 10; small deploys (Railway trial: Postgres tuned to max_connections=30 shared
      # with Flyway + telegram-bot) want this lower. Local dev keeps the Hikari default.
      maximum-pool-size: ${DB_POOL_SIZE:10}

  flyway:
    enabled: true
    locations: classpath:db/migration
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/academix}
    user: ${DATABASE_USERNAME:academix}
    password: ${DATABASE_PASSWORD:academix}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Empty = no AUTH (local dev). Any networked deploy (e.g. Railway private networking)
      # must set REDIS_PASSWORD and start redis-server with --requirepass.
      password: ${REDIS_PASSWORD:}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    # RabbitMQ's built-in guest/guest only accepts connections from localhost (loopback) — it
    # works in local dev and silently CANNOT work the moment the broker is reached over a real
    # network (Docker service name, Railway private networking, ...). Any networked deploy must
    # create its own user (RABBITMQ_DEFAULT_USER/PASS on the broker) and set these to match.
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  # Spring Boot's defaults (1MB file / 10MB request) are too low for real homework-photo
  # uploads — a real phone-camera photo of an exercise book (11.5MB) tripped the default
  # 10MB request cap with a raw SizeLimitExceededException before reaching any controller
  # (no ApiException/ERR_INVALID_FILE shape, just a Tomcat-level rejection). 20MB covers a
  # realistic single high-res photo; requests carry one image plus small form fields.
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  # Gmail SMTP for password-reset email — CLAUDE.md "Supporting tooling"'s decided approach
  # (academix_tz.md §2.1 forgot-password). GMAIL_USERNAME must be a real Gmail address,
  # GMAIL_APP_PASSWORD a 16-char App Password (not the account password — Gmail requires 2FA +
  # an App Password for SMTP since it doesn't accept plain account passwords for this anymore).
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}
  # Gzip JSON/text responses over 1KB — analytics/list payloads shrink several-fold for free.
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/html
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info

academix:
  # CORS — frontend and backend are different origins in local dev (see CLAUDE.md
  # "Reality checks": a real browser test silently failed with zero requests reaching
  # the backend before this existed; curl doesn't enforce CORS so it went undetected).
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  # Cookie Domain attribute for academix_auth/academix_refresh. Empty (default) = host-only,
  # correct for localhost dev. When frontend+backend are sibling subdomains of one registrable
  # domain (www.academixai.uz + api.academixai.uz), set COOKIE_DOMAIN=.academixai.uz so proxy.ts
  # on the frontend origin can see the auth cookie. See AuthController.
  cookie-domain: ${COOKIE_DOMAIN:}
  jwt:
    # dev-only placeholder — real deploys must set JWT_SECRET, never rely on this
    secret: ${JWT_SECRET:local-dev-only-placeholder-not-for-production-use}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
  # academix_tz.md §5.2 — upload virus scanning. OFF by default: the clamav image is ~1GB and
  # loads signature DBs for minutes on first boot, so requiring it would make the documented
  # local stack far heavier. Production must set ACADEMIX_CLAMAV_ENABLED=true; ClamAvScanner
  # logs a WARN on every startup while it's off so this can't be silently forgotten.
  clamav:
    enabled: ${ACADEMIX_CLAMAV_ENABLED:false}
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
    timeout-ms: ${CLAMAV_TIMEOUT_MS:30000}
  ai:
    qwen:
      api-key: ${QWEN_API_KEY:}
      base-url: ${QWEN_BASE_URL:https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
      model-text: ${QWEN_MODEL_TEXT:qwen3.7-max}
      model-vision: ${QWEN_MODEL_VISION:qwen3.7-plus}
    google-vision:
      api-key: ${GOOGLE_VISION_API_KEY:}
  telegram:
    # Backend only needs the bot's username, to build deep-link URLs (https://t.me/{username}
    # ?start=...) — it no longer calls the Telegram API or receives a webhook itself; that moved
    # to telegram-bot/ (which has its own TELEGRAM_BOT_TOKEN).
    bot-username: ${TELEGRAM_BOT_USERNAME:academix_notify_bot}
  storage:
    seaweedfs:
      # Must match the identity in infra/seaweedfs-config/s3-config.json — plain `seaweedfs -s3`
      # with no -s3.config rejects every signed request outright (confirmed by a real AWS SDK v2
      # call failing), so these aren't just placeholders, the container is actually configured to
      # require them. See CLAUDE.md "Reality checks".
      endpoint: ${SEAWEEDFS_S3_ENDPOINT:http://localhost:8333}
      access-key: ${SEAWEEDFS_ACCESS_KEY:local-dev-access-key}
      secret-key: ${SEAWEEDFS_SECRET_KEY:local-dev-secret-key}
      bucket: ${SEAWEEDFS_BUCKET:homeworks}

resilience4j:
  circuitbreaker:
    configs:
      # CLAUDE.md "Resilience" — shared by every AI vendor call (Qwen, Google Vision).
      default:
        failure-rate-threshold: 50
        slow-call-rate-threshold: 75
        slow-call-duration-threshold: 5s
        sliding-window-size: 10
        wait-duration-in-open-state: 60s
    instances:
      googleVision:
        base-config: default
      # qwen3.7-max has extended "reasoning" mode on — a real request took 52.9s (2218 of 2859
      # completion tokens were reasoning_content thinking tokens before the actual answer). The
      # shared 5s slow-call-duration-threshold would classify nearly every real Qwen call as
      # "slow," tripping the circuit open even when Qwen is working correctly. 75s gives margin
      # under AiRestClientTimeoutConfig's 90s read timeout while still catching genuine hangs.
      qwen:
        base-config: default
        slow-call-duration-threshold: 75s
