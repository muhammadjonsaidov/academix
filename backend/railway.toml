# Railway config-as-code for the backend service.
# Service settings in the Railway dashboard: Root Directory = backend
# (Railway then picks this file up automatically from backend/railway.toml).
#
# watchPatterns: only a commit touching backend/** triggers a rebuild of this service —
# frontend/infra-only commits don't burn build minutes or restart the API.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["backend/**"]

[deploy]
# /actuator/health is exposed and permitAll() (see SecurityConfig) — Railway only routes
# traffic to a deploy once this returns 200. Generous timeout: Flyway runs all migrations
# on first boot of a fresh database before the app is healthy.
healthcheckPath = "/actuator/health"
# 600, not 300: on the trial every dependency sleeps, and a cold-start backend may spend 1-2
# boot cycles waking postgres/seaweedfs before it can come healthy (confirmed: a real deploy
# was serving traffic at ~t+360s but the 300s window had already marked it FAILED).
healthcheckTimeout = 600
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# App Sleeping is enabled via the dashboard/API, not here (numReplicas/sleepApplication aren't
# reliable config-as-code keys — see infra/railway/postgres/railway.toml). The trial plan
# REQUIRES sleeping enabled on every service or deploys are silently rejected.

