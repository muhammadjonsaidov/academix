# Companion ingress Compose file: exposes the whole product on ONE origin (frontend + /api/*)
# so a single public tunnel (cloudflared / ngrok) can share it. Production keeps this listener on
# loopback; development can override the port binding when a LAN demo is explicitly required.
# Required because NEXT_PUBLIC_API_URL is baked into the frontend build and the auth
# cookies are host-only — two separate tunnels would break both.
#
#   cd infra
#   cp .env.example .env          # set NEXT_PUBLIC_API_URL=/api/v1 (relative!)
#   docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d --build
#   cloudflared tunnel --url http://localhost:8082
#
# Uses the same infra_default network, so `backend`/`frontend` resolve by service name.

services:
  nginx-dev:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ./nginx-tunnel.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
