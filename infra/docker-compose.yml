  # backend:
  #   build:
  #     context: ../backend
  #   environment:
  #     # App runtime connection: restricted academix_app role, NOT the migration
  #     # superuser below — see CLAUDE.md "Reality checks" (RLS is inert for a
  #     # superuser/BYPASSRLS role).
