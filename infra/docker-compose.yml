# Local dev: `docker-compose up -d` starts only the infra deps below —
# run backend/frontend locally via ./gradlew bootRun / npm run dev against them.
# The full app stack (backend/frontend/nginx/certbot, matching production —
# single-server per CLAUDE.md "Reality checks") is commented out further down;
# it's slow to build and not needed for routine local iteration. Uncomment it
# when actually testing a real container deploy.

services:
  postgres:
    # Plain postgres images don't bundle pgvector — confirmed by a real failed
    # migration during Sprint 0. See CLAUDE.md "Reality checks".
    image: pgvector/pgvector:pg18
    environment:
      # POSTGRES_USER is a superuser with BYPASSRLS by default (official image
      # behavior) — reserved for Flyway migrations only (CREATE EXTENSION etc.
      # genuinely need it). The app's actual runtime connection uses the
      # restricted academix_app role created by postgres-init/01-app-role.sh —
      # confirmed necessary by a real test showing RLS is silently inert for a
      # superuser/BYPASSRLS role. See CLAUDE.md "Reality checks".
      POSTGRES_USER: ${DATABASE_USERNAME:-academix}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-academix}
      POSTGRES_DB: academix
      ACADEMIX_APP_PASSWORD: ${DATABASE_APP_PASSWORD:-academix_app_local_dev_only}
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18's official image changed convention: mount the parent dir, not
      # /var/lib/postgresql/data — confirmed by a real container startup failure.
      - postgres-data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-academix}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8.0
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:4.3.2-management
    ports:
      - "5672:5672"
      - "15672:15672" # management UI

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    # Plain `-s3` with no `-s3.config` rejects ALL signed requests outright ("Signed request
    # requires setting up SeaweedFS S3 authentication") — confirmed by a real AWS SDK v2 PUT
    # failing with InvalidRequestException even though unsigned GETs worked fine. The AWS SDK
    # always signs (SigV4) when given credentials, so the backend's S3Client can't talk to an
    # unconfigured SeaweedFS at all. Fixed by giving it a real identity matching the backend's
    # SEAWEEDFS_ACCESS_KEY/SECRET_KEY defaults (see application.yml) via seaweedfs-config/s3-config.json.
    command: server -s3 -s3.config=/etc/seaweedfs/s3-config.json -dir=/data
    ports:
      - "8333:8333" # S3 API
      - "9333:9333" # master UI
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs-config/s3-config.json:/etc/seaweedfs/s3-config.json:ro

  # academix_tz.md §5.2 upload virus scanning. Behind the "antivirus" profile so it does NOT
  # start with a plain `docker-compose up -d`: the image is ~1GB and spends several minutes
  # loading signature databases before clamd accepts its first connection, which is a heavy
  # default for local dev. Start it explicitly and flip the backend flag together:
  #   docker-compose --profile antivirus up -d clamav
  #   ACADEMIX_CLAMAV_ENABLED=true in backend/.env
  # The backend fails uploads closed when the flag is on and clamd is unreachable, so turn
  # both on together — and give clamd time to finish loading before the first upload.
  clamav:
    image: clamav/clamav:1.5.3
    ports:
      - "3310:3310" # clamd TCP (INSTREAM) — what ClamAvScanner connects to
    volumes:
      - clamav-db:/var/lib/clamav # persist signature DBs so restarts don't re-download ~1GB
    healthcheck:
      # clamd answers PING with PONG only once signature loading is complete.
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    profiles: ["antivirus"]

  postgres-backup:
    image: prodrigestivill/postgres-backup-local:latest
    depends_on:
      - postgres
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: academix
      POSTGRES_USER: ${DATABASE_USERNAME:-academix}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-academix}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 0
      BACKUP_KEEP_MONTHS: 0
    volumes:
      - ./backups:/backups
    profiles: ["prod"]

  # --- App-build services, intentionally commented out during Sprint 0+ local dev ---
  # Building backend/frontend via Docker is slow and gives no live output/debugging —
  # run them directly instead: `cd backend && ./gradlew bootRun`,
  # `cd frontend && npm run dev`, both against the infra services above. Uncomment
  # this whole block (and see deploy-release skill) when actually testing/running a
  # real container deploy, not for routine local iteration.
