  #     # Flyway migration connection: superuser (CREATE EXTENSION etc. need it)
  #     FLYWAY_USERNAME: ${DATABASE_USERNAME:-academix}
  #     FLYWAY_PASSWORD: ${DATABASE_PASSWORD:-academix}
  #     REDIS_HOST: redis
  #     RABBITMQ_HOST: rabbitmq
  #     JWT_SECRET: ${JWT_SECRET}
