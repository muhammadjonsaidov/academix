# Full AcademiX AI stack — one command, everything up:
#   docker compose up -d --build
# Then open http://localhost:3000 and log in with the demo accounts
# (infra/seed/demo-seed.sql header: ADMIN +998901234567 / Test1234!).
#
# The prod-only pieces (nginx/certbot TLS, postgres-backup, clamav) stay profile-gated:
#   docker compose --profile prod up -d      # nginx+certbot+backup, no clamav
#   docker compose --profile antivirus up -d clamav
#
# Copy infra/.env.example → infra/.env to supply real secrets (QWEN_API_KEY,
# GOOGLE_VISION_API_KEY, TELEGRAM_BOT_TOKEN, ...). Everything has working
# local-dev defaults, so a bare `up` also works.

services:
  postgres:
    # Plain postgres images don't bundle pgvector — confirmed by a real failed
    # migration during Sprint 0. See CLAUDE.md "Reality checks".
    image: pgvector/pgvector:pg18
    environment:
      # POSTGRES_USER is a superuser with BYPASSRLS by default (official image
      # behavior) — reserved for Flyway migrations only (CREATE EXTENSION etc.
      # genuinely need it). The app's actual runtime connection uses the
      # restricted academix_app role created by postgres-init/01-app-role.sh —
      # confirmed necessary by a real test showing RLS is silently inert for a
      # superuser/BYPASSRLS role. See CLAUDE.md "Reality checks".
      POSTGRES_USER: ${DATABASE_USERNAME:-academix}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-academix}
      POSTGRES_DB: academix
      ACADEMIX_APP_PASSWORD: ${DATABASE_APP_PASSWORD:-academix_app_local_dev_only}
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18's official image changed convention: mount the parent dir, not
      # /var/lib/postgresql/data — confirmed by a real container startup failure.
      - postgres-data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-academix}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8.0
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:4.3.2-management
    environment:
      # guest/guest only accepts loopback connections — over the compose network the
      # backend/telegram-bot are NOT loopback, so a real broker user is mandatory
      # (confirmed in application.yml's own note). Backend + telegram-bot read the
      # same RABBITMQ_USERNAME/RABBITMQ_PASSWORD below.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-academix}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-academix_local_dev}
    ports:
      - "5672:5672"
      - "15672:15672" # management UI

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    # Plain `-s3` with no `-s3.config` rejects ALL signed requests outright ("Signed request
    # requires setting up SeaweedFS S3 authentication") — confirmed by a real AWS SDK v2 PUT
    # failing with InvalidRequestException even though unsigned GETs worked fine. The AWS SDK
    # always signs (SigV4) when given credentials, so the backend's S3Client can't talk to an
    # unconfigured SeaweedFS at all. Fixed by giving it a real identity matching the backend's
    # SEAWEEDFS_ACCESS_KEY/SECRET_KEY defaults (see application.yml) via seaweedfs-config/s3-config.json.
    command: server -s3 -s3.config=/etc/seaweedfs/s3-config.json -dir=/data
    ports:
      - "8333:8333" # S3 API
      - "9333:9333" # master UI
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs-config/s3-config.json:/etc/seaweedfs/s3-config.json:ro

  backend:
    build:
      context: ../backend
    environment:
      # App runtime connection: restricted academix_app role, NOT the migration
      # superuser below — see CLAUDE.md "Reality checks" (RLS is inert for a
      # superuser/BYPASSRLS role).
      DATABASE_URL: jdbc:postgresql://postgres:5432/academix
      DATABASE_APP_USERNAME: ${DATABASE_APP_USERNAME:-academix_app}
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD:-academix_app_local_dev_only}
      # Flyway migration connection: superuser (CREATE EXTENSION etc. need it)
      DATABASE_USERNAME: ${DATABASE_USERNAME:-academix}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-academix}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-academix}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-academix_local_dev}
      # Must be byte-for-byte identical to the frontend's — proxy.ts and JwtService
      # derive their HMAC key from the raw bytes; a mismatch logs everyone out.
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-placeholder-not-for-production-use}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      SEAWEEDFS_S3_ENDPOINT: http://seaweedfs:8333
      SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:-local-dev-access-key}
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:-local-dev-secret-key}
      SEAWEEDFS_BUCKET: ${SEAWEEDFS_BUCKET:-homeworks}
      # Real AI/email/telegram keys — app degrades gracefully without them
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY:-}
      GMAIL_USERNAME: ${GMAIL_USERNAME:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-academix_notify_bot}
      # prod profile skips the dev badge seeder — the `seed` service below owns
      # all demo data (fixed badge ids that demo-seed.sql references).
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      seaweedfs:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  telegram-bot:
    build:
      context: ../telegram-bot
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/academix
      DATABASE_APP_USERNAME: ${DATABASE_APP_USERNAME:-academix_app}
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD:-academix_app_local_dev_only}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-academix}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-academix_local_dev}
      # Empty token = bot logs "polling skipped" and the app works without Telegram
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-academix_notify_bot}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

  frontend:
    build:
      context: ../frontend
      args:
        # NEXT_PUBLIC_* are inlined at build time — the browser talks to the
        # backend directly on the published port (CORS allows localhost:3000).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME:-academix_notify_bot}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        # Rewrite target, baked at build time (see frontend/Dockerfile + next.config.ts).
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8080}
    environment:
      # Runtime-only (proxy.ts route-guard cookie verification) — byte-for-byte
      # identical to the backend's JWT_SECRET.
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-placeholder-not-for-production-use}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

  # One-shot: after Flyway has created the schema (backend healthy), apply the
  # fresh-DB bootstrap + the demo seed. Idempotent, exits after running.
  seed:
    image: postgres:18-alpine
    environment:
      PGPASSWORD: ${DATABASE_PASSWORD:-academix}
    volumes:
      - ./seed/bootstrap.sql:/bootstrap.sql:ro
      - ./seed/demo-seed.sql:/demo-seed.sql:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Waiting for backend health (Flyway schema)..."
        until wget -qO- http://backend:8080/actuator/health 2>/dev/null | grep -q UP; do sleep 3; done
        psql -v ON_ERROR_STOP=1 -h postgres -U ${DATABASE_USERNAME:-academix} -d academix -f /bootstrap.sql
        psql -v ON_ERROR_STOP=1 -h postgres -U ${DATABASE_USERNAME:-academix} -d academix -f /demo-seed.sql
        echo "Seed complete — demo logins ready."
    restart: "no"
    depends_on:
      backend:
        condition: service_healthy

  # academix_tz.md §5.2 upload virus scanning. ~1GB image, slow signature load —
  # profile-gated so a plain `up` stays light. Backend flag: ACADEMIX_CLAMAV_ENABLED=true.
  clamav:
    image: clamav/clamav:1.5.3
    ports:
      - "3310:3310" # clamd TCP (INSTREAM) — what ClamAvScanner connects to
    volumes:
      - clamav-db:/var/lib/clamav # persist signature DBs so restarts don't re-download ~1GB
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    profiles: ["antivirus"]

  postgres-backup:
    image: prodrigestivill/postgres-backup-local:latest
    depends_on:
      - postgres
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: academix
      POSTGRES_USER: ${DATABASE_USERNAME:-academix}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-academix}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 0
      BACKUP_KEEP_MONTHS: 0
    volumes:
      - ./backups:/backups
    profiles: ["prod"]

  # --- Production TLS front (needs real certs; infra/nginx/nginx.conf is Let's
  #     Encrypt-oriented). Local/one-command dev goes straight to :3000/:8080. ---
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    depends_on:
      - backend
      - frontend
    profiles: ["prod"]

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"
    profiles: ["prod"]

volumes:
  postgres-data:
  seaweedfs-data:
  clamav-db: # only used by the profile-gated clamav service above
  certbot-www:
  certbot-certs:
