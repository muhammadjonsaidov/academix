# Local dev: `docker-compose up -d` (no profile) starts only the infra deps —
# run backend/frontend locally via ./gradlew bootRun / npm run dev against them.
# Full stack (matches production, single-server per CLAUDE.md "Reality checks"):
# `docker-compose --profile prod up -d` also builds/runs backend, frontend, nginx.

services:
  postgres:
    # Plain postgres images don't bundle pgvector — confirmed by a real failed
    # migration during Sprint 0. See CLAUDE.md "Reality checks".
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-academix}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-academix}
      POSTGRES_DB: academix
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18's official image changed convention: mount the parent dir, not
      # /var/lib/postgresql/data — confirmed by a real container startup failure.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-academix}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8.0
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:4.3.2-management
    ports:
      - "5672:5672"
      - "15672:15672" # management UI

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -dir=/data
    ports:
      - "8333:8333" # S3 API
      - "9333:9333" # master UI
    volumes:
      - seaweedfs-data:/data

  postgres-backup:
    image: prodrigestivill/postgres-backup-local:latest
    depends_on:
      - postgres
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: academix
      POSTGRES_USER: ${DATABASE_USERNAME:-academix}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-academix}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 0
      BACKUP_KEEP_MONTHS: 0
    volumes:
      - ./backups:/backups
    profiles: ["prod"]

  backend:
    build:
      context: ../backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/academix
      DATABASE_USERNAME: ${DATABASE_USERNAME:-academix}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-academix}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      JWT_SECRET: ${JWT_SECRET}
      QWEN_API_KEY: ${QWEN_API_KEY}
      GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY}
      SEAWEEDFS_S3_ENDPOINT: http://seaweedfs:8333
      SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY}
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    profiles: ["prod"]

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://academixai.uz/api/v1}
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
    depends_on:
      - backend
    profiles: ["prod"]

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    depends_on:
      - backend
      - frontend
    profiles: ["prod"]

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"
    profiles: ["prod"]

volumes:
  postgres-data:
  seaweedfs-data:
  certbot-www:
  certbot-certs:
