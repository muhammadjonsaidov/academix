volumes:
  postgres-data:
  seaweedfs-data:
  clamav-db: # only used by the profile-gated clamav service above
  # certbot-www / certbot-certs only used by the commented-out nginx/certbot
  # services above — uncomment alongside them.
  # certbot-www:
  # certbot-certs:
