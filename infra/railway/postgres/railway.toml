# Railway config-as-code for the Postgres service.
# Root Directory = infra/railway/postgres. Volume: /var/lib/postgresql (parent dir — pg18!).
# Never enable sleep on the database.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["infra/railway/postgres/**"]

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
sleepApplication = false
