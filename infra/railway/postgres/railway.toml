# Railway config-as-code for the Postgres service.
# Root Directory = infra/railway/postgres. Volume: /var/lib/postgresql (parent dir — pg18!).
#
# NOTE: no sleepApplication/numReplicas keys here — numReplicas isn't in the config-as-code
# schema, and sleepApplication is managed via the dashboard/API instead: Railway's TRIAL plan
# instantly rejects (zero log output!) any deploy of a service with sleeping disabled, while
# after upgrading we want the database NOT to sleep. Keeping the key out of the toml lets the
# dashboard setting decide without a code change. (Confirmed live: sleep-off = silent
# instant FAILED at BUILD_IMAGE/SNAPSHOT_CODE, sleep-on = deploys fine.)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["infra/railway/postgres/**"]

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
