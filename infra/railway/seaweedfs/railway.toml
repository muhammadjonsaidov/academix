# Railway config-as-code for the SeaweedFS service.
# Root Directory = infra/railway/seaweedfs. Volume: /data. Private networking only (no public
# domain — the browser never fetches from SeaweedFS; all bytes go through the backend).
# Never sleep: the backend holds an S3 client against it and uploads arrive with requests.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["infra/railway/seaweedfs/**"]

# (no sleepApplication/numReplicas keys — see postgres/railway.toml for why)
[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
