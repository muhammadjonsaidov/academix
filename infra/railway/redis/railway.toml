# Railway config-as-code for the Redis service.
# Root Directory = infra/railway/redis. Volume: /data.
# Never sleep: the backend holds Lettuce connections.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["infra/railway/redis/**"]

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
sleepApplication = false
