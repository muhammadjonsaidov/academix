# Railway config-as-code for the RabbitMQ service.
# Root Directory = infra/railway/rabbitmq. Volume: /var/lib/rabbitmq (durable queues + messages
# survive restarts — the DLQ contents matter for debugging failed AI grading).
# Never sleep: the backend holds AMQP connections with heartbeats.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["infra/railway/rabbitmq/**"]

# (no sleepApplication/numReplicas keys — see postgres/railway.toml for why)
[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

