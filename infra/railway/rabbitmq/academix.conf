# Small-footprint tuning for Railway trial (0.5GB/service cap).
# Absolute memory watermark instead of the default 0.4-of-detected-RAM: inside Railway the
# runtime "detects" the host's RAM, not the service cap, so the relative default would let the
# broker balloon far past what the service is actually allowed.
vm_memory_high_watermark.absolute = 192MB

# Default disk_free_limit is fine locally but Railway volumes are small; alarm only below 256MB.
disk_free_limit.absolute = 256MB
