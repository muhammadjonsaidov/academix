# Single-origin reverse proxy for the public-tunnel demo (see docker-compose.tunnel.yml).
# Plain HTTP — TLS is terminated by the tunnel provider (cloudflared/ngrok), which the
# backend needs anyway because the auth cookies are Secure.
#
# /api/  -> backend (SSE-friendly: buffering off + long read timeout for /api/v1/realtime)
# /      -> frontend (WebSocket-ish upgrade headers for Next.js)

server {
    listen 80;
    server_name _;

    # Backend allows 20MB uploads (see application.yml multipart) — nginx's 1MB default
    # would reject homework/exam photos with 413 before they ever reach the backend.
    client_max_body_size 21m;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Every request here is same-origin by construction (browser -> this proxy -> backend),
        # yet browsers still send Origin on POSTs and Spring Security's CorsFilter rejects any
        # origin outside FRONTEND_URL with 403 "Invalid CORS request". Stripping it lets the
        # request through without a CORS check; same-origin browsers never need CORS headers,
        # and auth stays protected by SameSite=Strict cookies + Bearer tokens. This is what made
        # login through the tunnel fail with the generic "Telefon raqam yoki parol noto'g'ri".
        proxy_set_header Origin "";
        # SSE (/api/v1/realtime/events) must stream, not buffer
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
