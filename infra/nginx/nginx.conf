# Reverse proxy in front of both containers — see CLAUDE.md "Supporting tooling".
# TLS termination via Let's Encrypt/Certbot; this file assumes certs are already
# provisioned at the paths below (see infra/docker-compose.yml's certbot service).

server {
    listen 80;
    server_name _;

    # Certbot HTTP-01 challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/academixai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/academixai/privkey.pem;

    # Backend API — proxied first since it's the more specific path
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend actuator health check, not exposed under /api
    location /health {
        proxy_pass http://backend:8080/actuator/health;
    }

    # Everything else — Next.js frontend
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
